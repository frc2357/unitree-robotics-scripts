[build-system] 
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unitree-robot-scripts"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
]

# Scripts repo, not an installable library: skip setuptools' flat-layout auto-discovery
# (it errors when several top-level script folders exist).
[tool.setuptools]
packages = []

[dependency-groups]
robot-preinstalled = [
    "cyclonedds==0.10.2", # Required DDS middleware for unitree\_sdk2\_python
    "numpy>=1.20.0", 
    "opencv-python",
    "unitree-sdk2py",
] 

dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "ruff>=0.17.1",
]

[tool.uv.sources]
unitree-sdk2py = { path = "../unitree_sdk2_python", editable = true }

[tool.mypy]
exclude = [
    '^devops/verify_sdk.*\.py$'
]
